# Kalkulator to statyczna strona — publikujemy repozytorium tak, jak jest, po każdej zmianie na main.
name: Publikacja kalkulatora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Najpierw testy silnika (cięcie + wyceny zgodne z arkuszem). Czerwone = brak publikacji.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy
        run: node --test tests/*.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Numer wersji nadawany przy wdrożeniu (czas commita, Warszawa) — pasek „nowa wersja” w aplikacji
      - name: Numer wersji
        run: ./scripts/release.sh "$(TZ=Europe/Warsaw date -d @$(git log -1 --format=%ct) +%Y.%m.%d.%H%M)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
